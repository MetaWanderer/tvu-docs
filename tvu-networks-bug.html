<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Powered by TVU Networks — Corner Bug</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     TVU NETWORKS — "Powered by" corner bug
     Self-contained, transparent. Drop into OBS / Streamlabs /
     any browser source. Bottom-right corner.

     TIMELINE (one full loop = ~13 min):
       1. animate ON,  hold ~1 min
       2. animate OFF, stay off ~5 min
       3. animate ON,  hold ~2 min
       4. animate OFF, stay off ~5 min  -> loops

     Tune the numbers in the CFG block near the bottom of this
     file. Add ?demo=1 to the URL to preview the whole cycle at
     20x speed (~40s) so you can see it on and off quickly.
     ========================================================= */

  :root {
    --green: #2AC93A;
    --green-glow: rgba(42, 201, 58, 0.35);
    --trans: 1.1s;              /* slide in / out duration */
    --offset: 34px;            /* distance from the corner */
    --font: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;    /* transparent for overlay use */
    overflow: hidden;
    font-family: var(--font);
  }

  /* ---- outer positioner: handles the slide on/off ---- */
  #bug {
    position: fixed;
    bottom: var(--offset);
    right: var(--offset);
    /* parked off-screen to the right until .on is added */
    transform: translateX(calc(100% + var(--offset) + 20px));
    opacity: 0;
    transition:
      transform var(--trans) cubic-bezier(0.16, 1, 0.3, 1),
      opacity   var(--trans) ease;
    will-change: transform, opacity;
  }
  #bug.on {
    transform: translateX(0);
    opacity: 1;
  }

  /* ---- inner floater: subtle idle movement while on screen ---- */
  .float {
    animation: float 6.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  /* ---- the glass pill lockup ---- */
  .pill {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 11px 20px 11px 13px;
    border-radius: 999px;
    background: rgba(11, 11, 11, 0.72);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid rgba(42, 201, 58, 0.45);
    box-shadow:
      0 8px 30px rgba(0, 0, 0, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    animation: breathe 4.6s ease-in-out infinite;
  }
  /* soft breathing green glow */
  @keyframes breathe {
    0%, 100% { box-shadow: 0 8px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset, 0 0 0px 0px var(--green-glow); }
    50%      { box-shadow: 0 8px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03) inset, 0 0 22px 2px var(--green-glow); }
  }

  .mark {
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    display: block;
    filter: drop-shadow(0 0 6px rgba(42, 201, 58, 0.25));
    animation: markpulse 4.6s ease-in-out infinite;
  }
  @keyframes markpulse {
    0%, 100% { transform: scale(1);    opacity: 0.96; }
    50%      { transform: scale(1.04); opacity: 1;    }
  }

  .txt {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
    padding-right: 2px;
  }
  .kicker {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.62);
  }
  .brand {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.2px;
    color: #ffffff;
    margin-top: 1px;
  }
  .brand .net {
    color: var(--green);
    font-weight: 700;
  }
</style>
</head>
<body>
  <div id="bug">
    <div class="float">
      <div class="pill">
        <img class="mark" id="mark" alt="TVU Networks" />
        <div class="txt">
          <span class="kicker">Powered by</span>
          <span class="brand">TVU&nbsp;<span class="net">Networks</span></span>
        </div>
      </div>
    </div>
  </div>
